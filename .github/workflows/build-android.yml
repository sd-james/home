name: Build Android

# Start by hand: Actions tab → "Build Android" → "Run workflow".
# Needed after changes to native code (modules/), permissions, packages with
# native code or native settings in app.json. Everything else arrives as an
# update when you push to main.
on: workflow_dispatch

jobs:
  build:
    name: Start EAS build (preview APK)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "You must provide an EXPO_TOKEN secret linked to this project's Expo account in this repo's secrets."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Check types, lint and tests
        run: |
          npx tsc --noEmit
          npx expo lint
          npm test

      # --non-interactive: on the first run EAS generates the Android signing
      # key and stores it on Expo's servers, so later builds sign with the same key.
      # --no-wait: the job ends once the build is queued; follow it on expo.dev.
      - name: Start build
        run: eas build --platform android --profile preview --non-interactive --no-wait
