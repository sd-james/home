name: Deploy Firebase

# Deploys the household backend in firebase/: Cloud Functions, Firestore rules
# and indexes. Runs when firebase/ changes on main, or by hand from the Actions
# tab. Needs the FIREBASE_SERVICE_ACCOUNT secret (a service account key JSON
# for the Firebase project); without it the job skips.
on:
  push:
    branches: [main]
    paths: ['firebase/**', '.github/workflows/deploy-firebase.yml']
  workflow_dispatch:

concurrency:
  group: deploy-firebase
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy functions and Firestore rules
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check for FIREBASE_SERVICE_ACCOUNT
        id: secret
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::notice::FIREBASE_SERVICE_ACCOUNT isn't set yet, so nothing was deployed."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.secret.outputs.present == 'true'
        uses: actions/checkout@v5

      - name: Setup Node
        if: steps.secret.outputs.present == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json

      - name: Install and test functions
        if: steps.secret.outputs.present == 'true'
        working-directory: firebase/functions
        run: |
          npm ci
          npm test

      - name: Deploy
        if: steps.secret.outputs.present == 'true'
        working-directory: firebase
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          PROJECT=$(node -e "console.log(require(process.env.GOOGLE_APPLICATION_CREDENTIALS).project_id)")
          echo "Deploying to $PROJECT"
          npx --yes firebase-tools@15 deploy \
            --only functions,firestore:rules,firestore:indexes \
            --project "$PROJECT" --non-interactive --force
