# Temporary one-off: set the Expo project to unlisted. Delete after running.
name: Set Expo project privacy

on: workflow_dispatch

jobs:
  set-privacy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set privacy to unlisted
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          curl -sS --fail-with-body https://api.expo.dev/graphql \
            -H "Authorization: Bearer $EXPO_TOKEN" -H 'content-type: application/json' \
            -d '{"query":"mutation { me { updateApp(appData: { id: \"08996c47-64d7-45fd-b395-a40390e55765\", privacy: \"UNLISTED\" }) { id fullName privacy } } }"}' | tee out.json
          grep -qi '"privacy":"unlisted"' out.json
